<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spese personali</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <header class="intestazione">
      <h1>Spese personali</h1>
      <p class="totale">Totale <strong id="totale">—</strong> <span id="conteggio" class="conteggio"></span></p>
    </header>

    <form id="form-spesa" class="scheda" novalidate>
      <p id="titolo-form" class="titolo-form">Nuova spesa</p>
      <div class="campo">
        <label for="data">Data</label>
        <input type="date" id="data" name="data" required>
      </div>
      <div class="campo">
        <label for="importo">Importo (€)</label>
        <input type="number" id="importo" name="importo" step="0.01" min="0.01" placeholder="0,00" required>
      </div>
      <div class="campo">
        <label for="categoria">Categoria</label>
        <select id="categoria" name="categoria" required></select>
      </div>
      <div class="campo campo-largo">
        <label for="descrizione">Descrizione</label>
        <input type="text" id="descrizione" name="descrizione" maxlength="200" placeholder="facoltativa">
      </div>
      <div class="azioni-form">
        <button type="submit" id="bottone-invia">Aggiungi spesa</button>
        <button type="button" id="bottone-annulla" class="secondario" hidden>Annulla</button>
      </div>
    </form>

    <ul id="errori" class="errori" hidden></ul>

    <section class="scheda filtri" aria-label="Filtri">
      <p class="titolo-form">Filtri</p>
      <div class="campo">
        <label for="filtro-da">Dal</label>
        <input type="date" id="filtro-da">
      </div>
      <div class="campo">
        <label for="filtro-a">Al</label>
        <input type="date" id="filtro-a">
      </div>
      <div class="campo">
        <label for="filtro-categoria">Categoria</label>
        <select id="filtro-categoria"></select>
      </div>
      <div class="campo campo-largo">
        <label for="filtro-testo">Cerca nella descrizione</label>
        <input type="search" id="filtro-testo" placeholder="es. supermercato">
      </div>
      <div class="scorciatoie">
        <button type="button" data-periodo="mese">Questo mese</button>
        <button type="button" data-periodo="mese-scorso">Mese scorso</button>
        <button type="button" data-periodo="anno">Quest'anno</button>
        <button type="button" data-periodo="azzera">Azzera filtri</button>
      </div>
    </section>

    <table id="tabella" class="scheda">
      <thead>
        <tr>
          <th>Data</th>
          <th>Categoria</th>
          <th>Descrizione</th>
          <th class="num">Importo</th>
          <th><span class="etichetta-nascosta">Azioni</span></th>
        </tr>
      </thead>
      <tbody id="corpo-tabella"></tbody>
    </table>

    <p id="vuoto" class="vuoto" hidden>Nessuna spesa registrata finora.</p>

    <details class="scheda gestione">
      <summary>Gestisci categorie</summary>
      <form id="form-categoria" class="riga-aggiunta" novalidate>
        <label for="nuova-categoria" class="etichetta-nascosta">Nuova categoria</label>
        <input type="text" id="nuova-categoria" name="nome" maxlength="40" placeholder="Nome della nuova categoria">
        <button type="submit">Aggiungi</button>
      </form>
      <ul id="elenco-categorie" class="elenco-categorie"></ul>
    </details>
  </main>

  <dialog id="dialogo-conferma">
    <form method="dialog">
      <h2 id="titolo-conferma">Eliminare la spesa?</h2>
      <p id="dettaglio-conferma"></p>
      <div class="azioni-dialogo">
        <button value="annulla" class="secondario">Annulla</button>
        <button value="conferma" class="distruttivo">Elimina</button>
      </div>
    </form>
  </dialog>

  <script src="/app.js"></script>
</body>
</html>
